name: guard

# Быстрый страж на каждый push и pull request. Он не собирает проект — это
# делает Vercel, — а проверяет ровно две вещи, из-за которых сайт обычно и
# ломают: не утёк ли секрет в код и не появился ли публичный маршрут без
# ограничения частоты запросов.
#
# Коммиты бота обновления зависимостей пропускаем: они не трогают маршруты,
# а падающие письма по ним только зашумляют почту.

on:
  push:
    branches: [main]
    # Правки, которые стражу нечего проверять, его не поднимают.
    # Замер 29.08.2026: 2000 минут Actions из 2000 израсходованы, и
    # большая часть прогонов пришлась на правки текстов.
    #
    # `.json` СОЗНАТЕЛЬНО НЕ ИСКЛЮЧЁН: я сама клала туда токены, и
    # страж обязан их ловить. Исключены только разметка и картинки —
    # там секрет не появится.
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      - '**/*.ico'
      - '**/*.mp4'
      - '**/*.mp3'
  pull_request:
  # Ручной запуск. 6 августа 2026 у GitHub был крупный сбой Actions: событие
  # push от двух коммитов пропало вместе с ним, и страж по ним не проходил
  # ВООБЩЕ — не «упал», а просто не существовал, поэтому и перезапускать было
  # нечего. Кнопка «Run workflow» позволяет прогнать проверку по любой ветке,
  # не выдумывая для этого пустой коммит.
  workflow_dispatch:

# Наименьшие права. Без явного указания задание получает права по
# умолчанию, а в старых хранилищах это чтение И ЗАПИСЬ на всё: чужой код,
# попавший сюда через зависимость или действие, смог бы писать в
# репозиторий от нашего имени. Нужно ему только чтение содержимого.
# Пуш отменяет предыдущий незаконченный прогон этой же ветки.
#
# ЦЕНА НАЗВАНА ЧЕСТНО: при двух пушах подряд первый коммит останется
# непроверенным. При линейной работе это неважно — проверяется итоговое
# состояние ветки, а промежуточный коммит живёт минуты. Зато устаревшие
# прогоны перестают доедать минуты впустую.
concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node и Python НЕ СТАВЯТСЯ: на образе ubuntu-latest они уже есть,
      # а установка занимала почти всю минуту прогона. Замер: guard.mjs
      # пользуется только node:fs и node:path — они есть с 14-й версии.
      - name: Секреты и лимиты
        run: node scripts/guard.mjs
      # Валидатор Конституции: запрещённые термины и авторство коммитов.
      # По Конституции он обязан запускаться перед каждым коммитом, но
      # локальный крючок git не передаётся вместе с репозиторием — на другой
      # машине его просто нет. Проверка при выкладке работает всегда и для всех.
      - name: Конституция — терминология и авторство
        # python3, а не python: на образе ubuntu есть только он. Ровно
        # ради этого раньше и ставился setup-python — целая минута на
        # каждом прогоне вместо одной буквы в команде.
        run: python3 .spec-kit/validator.py
